# The full fixture (tools/session/agent/subagent/subagent-spawn + mop-executor).
# mop-executor carries no config here, so composition.test.mjs asserts its Config
# schema defaults (provider/model/maxOutputChars) land in apply's second arg.
# (History: this row originally failed to boot because mop-executor used
# z.number().int(), absent from real schemastery — fixed to z.natural().)
- id: session
  name: '@deepseek-ai/dsh-session'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: mop-executor
  name: '@chillizu/mop-executor'
