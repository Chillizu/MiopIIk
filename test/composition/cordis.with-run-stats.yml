# run-stats 契约锚 fixture：真实 session-projection + token-meter + mop-run-stats。
# token-meter 挂载后经 ctx.inject(['sessionProjections']) 注册 tokenUsage 投影，
# 使 sessionProjections.snapshot(session).values.tokenUsage 恒存在（零桶），
# undefined 只意味着 tokenMeter 未挂载。本 fixture 证明 Config z.object({}) 经真实
# Loader 过 + mop-run-stats 硬 inject tools + tokenUsage 投影键确实注册。
- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'

- id: mop-run-stats
  name: '@chillizu/mop-run-stats'
